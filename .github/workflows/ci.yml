name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest
      - name: Lint tests
        run: |
          pip install ruff
          ruff check tests
        # app/main.py is linted when T-API-01 is allowed to touch it.
